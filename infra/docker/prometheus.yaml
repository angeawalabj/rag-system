# ─────────────────────────────────────────────────────────────────────────────
# Prometheus — configuration de scraping v1
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    project:     rag-system

# ─── Alerting — règles chargées, Alertmanager optionnel en v1 ────────────────
rule_files:
  - /etc/prometheus/alert-rules.yaml

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: [alertmanager:9093]

# ─── Jobs de scraping ────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # OTel Collector (métriques du pipeline de collecte)
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  # Métriques applicatives exposées par l'OTel Collector
  - job_name: rag-apps-via-otel
    static_configs:
      - targets: [otel-collector:8889]

  # Service d'ingestion (métriques Prometheus directes)
  - job_name: ingestion
    static_configs:
      - targets: [ingestion:8001]
    metrics_path: /metrics
    scrape_interval: 15s

  # RAG API
  - job_name: rag-api
    static_configs:
      - targets: [rag-api:8000]
    metrics_path: /metrics
    scrape_interval: 15s

  # Qdrant
  - job_name: qdrant
    static_configs:
      - targets: [qdrant:6333]
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis exporter (si déployé, optionnel en v1)
  # - job_name: redis
  #   static_configs:
  #     - targets: [redis-exporter:9121]
