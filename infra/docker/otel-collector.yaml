# ─────────────────────────────────────────────────────────────────────────────
# OpenTelemetry Collector — configuration v1
# Reçoit : OTLP gRPC (4317) + OTLP HTTP (4318)
# Exporte : Jaeger (traces) + Prometheus endpoint (métriques)
# ─────────────────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Métriques du collector lui-même
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: [localhost:8888]

processors:
  # Batch : réduit le nombre d'appels réseau vers les exporters
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  # Limite mémoire : évite les OOM en cas de pic de trafic
  memory_limiter:
    limit_mib: 256
    spike_limit_mib: 64
    check_interval: 5s

  # Enrichissement des ressources
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  # ── Traces → Jaeger ──────────────────────────────────────────────────────
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # ── Métriques → Prometheus (pull) ────────────────────────────────────────
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: rag
    const_labels:
      environment: development

  # ── Debug (stdout) ────────────────────────────────────────────────────────
  debug:
    verbosity: normal
    sampling_initial: 2
    sampling_thereafter: 500

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]

  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [otlp/jaeger, debug]

    metrics:
      receivers:  [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters:  [prometheus]

    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [debug]

  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888
