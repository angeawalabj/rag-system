apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: rag-system
spec:
  ports:
    - port: 11434
  selector: { app: ollama }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: rag-system
spec:
  replicas: 1     # Un seul réplica v1 — pas de partage de modèles entre pods
  strategy:
    type: Recreate   # évite 2 pods qui montent le même PVC RWO
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      # ── GPU optionnel — actif uniquement si l'overlay prod le patch ──────────
      # nodeSelector:
      #   gpu: "true"
      containers:
        - name: ollama
          image: ollama/ollama:0.3.6
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests: { cpu: "1",  memory: 4Gi }
            limits:   { cpu: "4",  memory: 8Gi }
          readinessProbe:
            httpGet: { path: /api/tags, port: 11434 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/tags, port: 11434 }
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: rag-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 20Gi }
