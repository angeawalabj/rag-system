apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: rag-system
spec:
  ports:
    - port: 8001
  selector: { app: ingestion }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: rag-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingestion }
  template:
    metadata:
      labels: { app: ingestion }
    spec:
      containers:
        - name: ingestion
          image: ghcr.io/ton-user/rag-ingestion:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: rag-config }
          env:
            - name: SERVICE_NAME
              value: ingestion
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: rag-secrets, key: POSTGRES_DSN } }
          volumeMounts:
            - name: upload-tmp
              mountPath: /app/uploads
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: upload-tmp
          emptyDir: { sizeLimit: 2Gi }
