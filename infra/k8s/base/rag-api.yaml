apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag-system
spec:
  ports:
    - port: 8000
  selector: { app: rag-api }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: rag-api }
  template:
    metadata:
      labels: { app: rag-api }
    spec:
      containers:
        - name: rag-api
          image: ghcr.io/ton-user/rag-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: rag-config }
          env:
            - name: SERVICE_NAME
              value: rag-api
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: rag-secrets, key: POSTGRES_DSN } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-api-hpa
  namespace: rag-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # évite le flapping
    scaleUp:
      stabilizationWindowSeconds: 30
