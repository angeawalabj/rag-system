apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-system

resources:
  - namespace.yaml
  - configmap.yaml
  - qdrant.yaml
  - postgres.yaml
  - redis.yaml
  - ollama.yaml
  - ingestion.yaml
  - rag-api.yaml
  - frontend.yaml
  # Observabilité
  - otel-collector.yaml
  - jaeger.yaml
  - prometheus.yaml
  - grafana.yaml

# ─── ConfigMap généré depuis le schéma SQL existant ──────────────────────────
# Source unique de vérité : infra/docker/init-db/01-schema.sql
# Évite la duplication entre Docker Compose et Kubernetes (ADR-0004)
configMapGenerator:
  - name: postgres-init-scripts
    files:
      - 01-schema.sql=../../docker/init-db/01-schema.sql

# ─── Labels communs appliqués à toutes les ressources ────────────────────────
commonLabels:
  app.kubernetes.io/part-of:    rag-system
  app.kubernetes.io/managed-by: kustomize

# ─── Images — overridées par overlay si besoin (ex: tag de build CI) ─────────
images:
  - name: ghcr.io/ton-user/rag-ingestion
    newTag: latest
  - name: ghcr.io/ton-user/rag-api
    newTag: latest
  - name: ghcr.io/ton-user/rag-frontend
    newTag: latest
