apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rag-system
spec:
  ports:
    - port: 3000
  selector: { app: frontend }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rag-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ton-user/rag-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: RAG_API_URL
              value: "http://rag-api:8000"
            - name: INGEST_API_URL
              value: "http://ingestion:8001"
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 250m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
