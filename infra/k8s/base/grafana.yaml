---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: rag-system
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
        access: proxy
        jsonData:
          timeInterval: 15s
      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger:16686
        access: proxy
        jsonData:
          nodeGraph: { enabled: true }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: rag-system
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: RAG System
        type: file
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/json
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: rag-system
type: Opaque
stringData:
  admin-user:     admin
  admin-password: CHANGE-ME-IN-PRODUCTION
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: rag-system
  labels:
    app: grafana
spec:
  ports:
    - port: 3000
      name: web
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: rag-system
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-user }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-password }
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-storage
              mountPath: /var/lib/grafana
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-storage-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage-pvc
  namespace: rag-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 2Gi }
