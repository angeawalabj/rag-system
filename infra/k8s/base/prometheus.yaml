---
# RBAC : Prometheus doit pouvoir scraper les pods/services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: rag-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rag-system-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rag-system-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rag-system-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: rag-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rag-system
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      external_labels:
        environment: production
        project:     rag-system

    rule_files:
      - /etc/prometheus/alert-rules.yaml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      - job_name: otel-collector-metrics
        static_configs:
          - targets: [otel-collector:8889]

      - job_name: ingestion
        static_configs:
          - targets: [ingestion:8001]
        metrics_path: /metrics

      - job_name: rag-api
        static_configs:
          - targets: [rag-api:8000]
        metrics_path: /metrics

      # Scrape dynamique des pods annotés
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [rag-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: rag-system
data:
  alert-rules.yaml: |
    groups:
      - name: rag-query-slo
        rules:
          - alert: RAGHighLatency
            expr: histogram_quantile(0.95, rate(rag_query_duration_seconds_bucket[5m])) > 10
            for: 5m
            labels: { severity: warning, service: rag-api }
            annotations:
              summary: "Latence p95 RAG > 10s"
              description: "Latence actuelle : {{ $value | humanizeDuration }}"

          - alert: RAGHighErrorRate
            expr: |
              (sum(rate(rag_queries_total{cache_hit="false"}[5m]))
              - sum(rate(rag_chunks_retrieved_count[5m])))
              / sum(rate(rag_queries_total[5m])) > 0.05
            for: 5m
            labels: { severity: critical, service: rag-api }
            annotations:
              summary: "Taux d'erreur RAG > 5%"

      - name: rag-infra-availability
        rules:
          - alert: QdrantDown
            expr: up{job="qdrant"} == 0
            for: 1m
            labels: { severity: critical, service: qdrant }
            annotations:
              summary: "Qdrant injoignable"

          - alert: IngestionServiceDown
            expr: up{job="ingestion"} == 0
            for: 1m
            labels: { severity: critical, service: ingestion }
            annotations:
              summary: "Service d'ingestion injoignable"

          - alert: RAGAPIDown
            expr: up{job="rag-api"} == 0
            for: 1m
            labels: { severity: critical, service: rag-api }
            annotations:
              summary: "RAG API injoignable"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rag-system
  labels:
    app: prometheus
spec:
  ports:
    - port: 9090
      name: web
  selector:
    app: prometheus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: rag-system
  labels:
    app: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
            - --storage.tsdb.wal-compression
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: alert-rules
              mountPath: /etc/prometheus/alert-rules.yaml
              subPath: alert-rules.yaml
            - name: prometheus-storage
              mountPath: /prometheus
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 2Gi }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: alert-rules
          configMap: { name: prometheus-alert-rules }
  volumeClaimTemplates:
    - metadata:
        name: prometheus-storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 20Gi }
